<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Nexus Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f81f7'/%3E%3Ctext x='32' y='44' font-size='34' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E" />
<style>
  :root{--bg:#0b0f14;--panel:#111823;--panel2:#0e141d;--line:#1e2a3a;--txt:#e8eef7;--muted:#8ba0b8;--accent:#2f81f7;--ok:#22c55e;--user:#1b2a3f}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#16233a,var(--bg) 60%);color:var(--txt);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Kufi Arabic",sans-serif;
    display:flex;flex-direction:column;height:100dvh;overscroll-behavior:none}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
    background:rgba(11,15,20,.86);backdrop-filter:blur(10px);position:sticky;top:0;z-index:9}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:grid;place-items:center;font-weight:800;font-size:14px}
  .brand{font-weight:800;line-height:1.1}.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{margin-inline-start:auto}
  .badge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
  .dot{width:7px;height:7px;border-radius:50%;background:#64748b}.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.15)}.dot.err{background:#ef4444}
  select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12px;max-width:38vw}
  main{flex:1;overflow-y:auto;padding:16px 12px 6px}
  .wrap{max-width:840px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .msg{display:flex;gap:9px;align-items:flex-start;animation:in .16s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .avatar{flex:0 0 28px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700}
  .u .avatar{background:var(--user);color:#9ec2ff}.a .avatar{background:linear-gradient(135deg,#1f3b2e,#14532d);color:#86efac}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px;max-width:calc(100% - 44px);
    white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
  .u .bubble{background:var(--user);border-color:#24374f}
  .bubble pre{background:#0a0f16;padding:10px;border-radius:10px;overflow:auto;margin:8px 0;direction:ltr;text-align:left}
  .bubble code{background:#0a0f16;padding:2px 5px;border-radius:5px;font-size:.9em;direction:ltr;display:inline-block}
  .bubble pre code{background:none;padding:0;display:block}
  .cursor::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .att{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0a0f16;max-width:150px}
  .att img,.att video{display:block;width:150px;height:100px;object-fit:cover}
  .att .fname{padding:6px 8px;font-size:11px;color:var(--muted);word-break:break-all}
  footer{padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(11,15,20,.92))}
  .composer{max-width:840px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px}
  .pending{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .chip-x{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:11px;max-width:100%}
  .chip-x b{font-weight:600;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip-x button{background:none;border:0;color:#fca5a5;cursor:pointer;font-size:14px;line-height:1}
  .bar{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--txt);font:inherit;padding:8px;max-height:38dvh;min-height:26px}
  button{font:inherit;border:0;cursor:pointer;border-radius:12px}
  .icon{background:var(--panel2);color:var(--txt);border:1px solid var(--line);width:40px;height:40px;display:grid;place-items:center;font-size:17px}
  .icon:hover{border-color:var(--accent)}
  #send{background:var(--accent);color:#fff;padding:10px 16px;font-weight:700}#send:disabled{opacity:.5;cursor:not-allowed}
  .hint{max-width:840px;margin:6px auto 0;color:var(--muted);font-size:11px;text-align:center}
  .empty{color:var(--muted);text-align:center;padding:30px 8px}
  .empty h1{font-size:20px;color:var(--txt);margin:0 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:999px;font-size:13px}
  .drop{position:fixed;inset:0;background:rgba(47,129,247,.14);border:3px dashed var(--accent);z-index:20;display:none;place-items:center;font-size:20px;font-weight:800}
  .drop.on{display:grid}
</style>
</head>
<body>
<header>
  <div class="logo">N</div>
  <div class="brand">Nexus Chat <small>ارفع صور وملفات · بلا سيرفر</small></div>
  <div class="spacer"></div>
  <select id="model" title="النموذج">
    <option value="openai">OpenAI</option>
    <option value="mistral">Mistral</option>
    <option value="llama">Llama</option>
  </select>
  <div class="badge"><span id="dot" class="dot on"></span><span id="statusTxt">جاهز</span></div>
</header>

<main id="main">
  <div class="wrap" id="wrap">
    <div class="empty" id="empty">
      <h1>مرحبا 👋</h1>
      <div>اسأل أي حاجة، وارفع صور/ملفات/فيديو مع سؤالك.</div>
      <div class="chips">
        <button class="chip" data-q="اشرح الفرق بين TCP و UDP باختصار">TCP vs UDP</button>
        <button class="chip" data-q="أعطني فكرة مشروع بسيط بـ HTML و JavaScript">فكرة مشروع</button>
        <button class="chip" data-q="اكتب دالة بايثون تحسب الأعداد الأولية">كود بايثون</button>
        <button class="chip" data-q="قولي حاجة مليحة نعملها اليوم في الجزائر">نصيحة</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <div class="pending" id="pending"></div>
    <div class="bar">
      <button class="icon" id="attach" title="إرفاق ملفات/صور/فيديو">📎</button>
      <input type="file" id="file" multiple hidden accept="*/*" />
      <textarea id="input" rows="1" placeholder="اكتب رسالتك… أو الصق/اسحب صورة"></textarea>
      <button id="send">إرسال</button>
    </div>
  </div>
  <div class="hint">Enter يرسل · Shift+Enter سطر جديد · 📎 أو سحب/لصق للملفات</div>
</footer>
<div class="drop" id="drop">أفلت الملفات هنا</div>

<script type="module">
const $ = (s) => document.querySelector(s);
const wrap = $("#wrap"), main = $("#main"), input = $("#input"), sendBtn = $("#send");
const modelSel = $("#model"), dot = $("#dot"), statusTxt = $("#statusTxt");
const fileInput = $("#file"), pendingEl = $("#pending"), drop = $("#drop");

const ENDPOINT = "https://text.pollinations.ai/openai";
const MAX_INLINE_IMAGE = 3 * 1024 * 1024;
const MAX_TEXT = 512 * 1024;
const history = [];          // {role, content}
const attachments = [];      // { id, name, type, size, url, dataUrl }
let streaming = false, currentEl = null, acc = "";

const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function render(text){
  const out = []; const re = /```([\w-]*)\n?([\s\S]*?)```/g; let last = 0, m;
  while ((m = re.exec(text))){ if (m.index > last) out.push({c:0,t:text.slice(last,m.index)}); out.push({c:1,t:m[2]}); last = re.lastIndex; }
  if (last < text.length) out.push({c:0,t:text.slice(last)});
  return out.map(p => p.c ? `<pre><code>${esc(p.t)}</code></pre>`
    : esc(p.t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")).join("");
}
const scroll = () => (main.scrollTop = main.scrollHeight);
function setStatus(kind, label){ dot.className = "dot" + (kind==="on"?" on":kind==="err"?" err":""); statusTxt.textContent = label; }

function addMsg(role, text){
  $("#empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + (role === "user" ? "u" : "a");
  el.innerHTML = `<div class="avatar">${role==="user"?"أنت":"AI"}</div><div class="bubble"><div class="content"></div></div>`;
  el.querySelector(".content").innerHTML = role === "user" ? esc(text) : "";
  wrap.appendChild(el); scroll(); return el;
}
function setText(el, text, done){
  const c = el.querySelector(".content");
  c.innerHTML = render(text); c.classList.toggle("cursor", !done); scroll();
}
function finish(){ streaming = false; sendBtn.disabled = false; currentEl = null; acc = ""; }

/* ---------- files ---------- */
const fmt = (s) => s > 1048576 ? (s/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(s/1024))+" KB";
const iconFor = (t) => /^image\//.test(t) ? "🖼️" : /^video\//.test(t) ? "🎬" : /^audio\//.test(t) ? "🎵" : /pdf/.test(t) ? "📄" : "📁";

function renderPending(){
  pendingEl.innerHTML = attachments.map(a => `
    <span class="chip-x">${iconFor(a.type)} <b title="${esc(a.name)}">${esc(a.name)}</b>
      <span style="color:var(--muted)">${fmt(a.size)}</span>
      <button data-rm="${a.id}" title="إزالة">×</button></span>`).join("");
}
pendingEl.onclick = (e) => {
  const id = e.target?.dataset?.rm; if (!id) return;
  const i = attachments.findIndex(a => a.id === id); if (i >= 0) attachments.splice(i, 1);
  renderPending();
};

function readAsDataURL(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result));
    r.onerror = () => rej(new Error("read failed"));
    r.readAsDataURL(file);
  });
}
function readAsText(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result));
    r.onerror = () => rej(new Error("read failed"));
    r.readAsText(file);
  });
}

const TEXTUAL = (type, name) =>
  /^text\/|json|xml|csv|javascript|typescript|markdown|x-sh|yaml/.test(type || "") ||
  /\.(txt|md|json|csv|log|js|mjs|ts|tsx|jsx|py|html|css|yml|yaml|sh|sql|java|c|cpp|go|rs|php)$/i.test(name);

async function addFiles(list){
  for (const f of [...list].slice(0, 8)){
    const att = { id: crypto.randomUUID(), name: f.name || "file", type: f.type || "", size: f.size, url: "", dataUrl: "", text: "" };
    try {
      if (/^image\//.test(att.type) && f.size <= MAX_INLINE_IMAGE){
        att.dataUrl = await readAsDataURL(f);
        att.url = att.dataUrl;
      } else if (/^video\//.test(att.type) || /^audio\//.test(att.type)){
        att.url = URL.createObjectURL(f);
      } else if (TEXTUAL(att.type, f.name) && f.size <= MAX_TEXT){
        att.text = (await readAsText(f)).slice(0, 24000);
      }
      attachments.push(att); renderPending();
    } catch (err) {
      const el = addMsg("assistant", ""); setText(el, `⚠️ ${f.name}: ${err.message}`, true);
    }
  }
}

$("#attach").onclick = () => fileInput.click();
fileInput.onchange = () => { addFiles(fileInput.files); fileInput.value = ""; };
["dragenter","dragover"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("on"); }));
["dragleave","drop"].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault();
  if (ev === "drop" && e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
  drop.classList.remove("on");
}));
document.addEventListener("paste", (e) => {
  const items = [...(e.clipboardData?.items || [])].filter(i => i.kind === "file");
  if (items.length) addFiles(items.map(i => i.getAsFile()).filter(Boolean));
});

/* ---------- send ---------- */
function buildUserContent(text){
  const parts = [];
  const texts = [];
  for (const a of attachments){
    if (a.text) texts.push(`[ملف: ${a.name}]\n\`\`\`\n${a.text}\n\`\`\``);
    else if (/^image\//.test(a.type) && a.dataUrl) parts.push({ type: "image_url", image_url: { url: a.dataUrl } });
    else if (/^video\//.test(a.type)) texts.push(`[فيديو: ${a.name} (${fmt(a.size)})] — ما نقدرش نشاهد الفيديو؛ وصف لي شنو تحب نعمل بيه.`);
    else if (/^audio\//.test(a.type)) texts.push(`[صوت: ${a.name} (${fmt(a.size)})]`);
    else texts.push(`[ملف: ${a.name} (${fmt(a.size)}, ${a.type || "binary"})]`);
  }
  const full = [texts.join("\n\n"), text].filter(Boolean).join("\n\n");
  if (parts.length) return [{ type: "text", text: full }, ...parts];
  return full || "(بدون نص)";
}

async function send(text){
  if (streaming) return;
  const hasFiles = attachments.length > 0;
  if (!text.trim() && !hasFiles) return;
  streaming = true; sendBtn.disabled = true;

  const el = addMsg("user", text || "(ملفات)");
  if (hasFiles){
    const box = document.createElement("div");
    box.className = "atts";
    box.innerHTML = attachments.map(a => {
      if (/^image\//.test(a.type)) return `<a class="att" href="${a.url}" target="_blank"><img src="${a.url}" alt="${esc(a.name)}"></a>`;
      if (/^video\//.test(a.type)) return `<span class="att"><video src="${a.url}" controls preload="metadata"></video><div class="fname">${esc(a.name)}</div></span>`;
      return `<span class="att"><div class="fname">${iconFor(a.type)} ${esc(a.name)}<br>${fmt(a.size)}</div></span>`;
    }).join("");
    el.querySelector(".bubble").appendChild(box);
  }
  scroll();

  const content = buildUserContent(text);
  history.push({ role: "user", content });
  attachments.length = 0; renderPending();
  input.value = ""; input.style.height = "auto";
  currentEl = null; acc = "";
  setStatus("on", "يفكر…");

  try {
    const isUrlImage = (c) => Array.isArray(c) && c.some((p) => p.type === "image_url");
    const flat = (c) => Array.isArray(c) ? c.map((p) => p.type === "text" ? p.text : "[صورة]").join("\n") : c;
    const trimmed = history.slice(-16);

    let r = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "content-type": "application/json", accept: "text/event-stream" },
      body: JSON.stringify({ model: modelSel.value, messages: trimmed, stream: true, private: true, referrer: "nexus-chat" }),
    });

    // some networks/models refuse multimodal parts: retry once as plain text
    if (!r.ok && trimmed.some((m) => isUrlImage(m.content))) {
      r = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "content-type": "application/json", accept: "text/event-stream" },
        body: JSON.stringify({
          model: modelSel.value,
          messages: trimmed.map((m) => ({ role: m.role, content: flat(m.content) })),
          stream: true, private: true, referrer: "nexus-chat",
        }),
      });
    }

    if (!r.ok) {
      const t = (await r.text()).slice(0, 240);
      throw new Error(`الخدمة ردّت ${r.status} — ${t || "بلا تفاصيل"}`);
    }

    const ctype = r.headers.get("content-type") || "";

    // plain JSON answer (no stream)
    if (!ctype.includes("event-stream")) {
      const txt = await r.text();
      let answer = txt;
      try {
        const j = JSON.parse(txt);
        answer = j.choices?.[0]?.message?.content ?? txt;
      } catch {}
      currentEl = addMsg("assistant", "");
      acc = String(answer);
      setText(currentEl, acc, true);
      history.push({ role: "assistant", content: acc });
      finish(); setStatus("on", "جاهز");
      return;
    }

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;){
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) !== -1){
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (!payload || payload === "[DONE]") continue;
        let j; try { j = JSON.parse(payload); } catch { continue; }
        const d = j.choices?.[0]?.delta?.content ?? j.choices?.[0]?.message?.content;
        if (typeof d === "string" && d){
          if (!currentEl) currentEl = addMsg("assistant", "");
          acc += d; setText(currentEl, acc, false);
        }
      }
    }
    if (currentEl) setText(currentEl, acc, true);
    history.push({ role: "assistant", content: acc });
    finish(); setStatus("on", "جاهز");
  } catch (err) {
    const el2 = currentEl || addMsg("assistant", "");
    setText(el2, `${acc}${acc ? "\n\n" : ""}⚠️ ${err.message}`, true);
    finish(); setStatus("err", "خطأ");
  }
}

input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, innerHeight*0.38)+"px"; });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(input.value); } });
sendBtn.onclick = () => send(input.value);
document.addEventListener("click", (e) => { const c = e.target.closest(".chip"); if (c) send(c.dataset.q); });
</script>
</body>
</html>
