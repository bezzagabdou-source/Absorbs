plugins {
    id 'com.android.application'
}

android {
    namespace 'app.dzexchange.marketplace'
    compileSdk 35

    defaultConfig {
        applicationId "app.dzexchange.marketplace"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // No signingConfig here on purpose: release artifacts are built UNSIGNED by CI
    // and signed offline with apksigner. The private key never touches CI or GitHub.
    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// Intentionally empty: no ads, no analytics, no third-party libraries.
dependencies {
}
