name: Build Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "screenshots/**"
      - "game/screenshots/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4.1-stable"
  GODOT_DIR: /tmp/godot
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  verify:
    name: Import project + headless smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot headless
        run: |
          mkdir -p "$GODOT_DIR"
          curl -fL --retry 3 -o "$GODOT_DIR/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q -o "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"
          "$GODOT_DIR/godot" --version
      - name: Import project
        run: |
          "$GODOT_DIR/godot" --headless --path game --import
      - name: Foundation unit tests
        timeout-minutes: 1
        run: |
          set +e
          "$GODOT_DIR/godot" --headless --path game --script res://tests/foundation_test.gd 2>&1 | tee /tmp/foundation.log
          code=${PIPESTATUS[0]}
          grep -iE 'FAIL|SCRIPT ERROR|Parse Error|SECTION' /tmp/foundation.log 2>/dev/null | head -25 | while read -r line; do echo "::error::$line"; done
          if grep -q 'SCRIPT ERROR' /tmp/foundation.log 2>/dev/null; then exit 1; fi
          exit $code
      - name: Foundation test log
        if: always()
        run: |
          grep -E 'SECTION|FAIL|SCRIPT ERROR|Parse Error|ERROR:' /tmp/foundation.log 2>/dev/null | head -40 | while read -r line; do echo "::error::$line"; done || true
          grep -A3 -B1 -E 'Parse Error|SCRIPT ERROR' /tmp/foundation.log 2>/dev/null | head -50 | while read -r line; do echo "::error::$line"; done || true
      - name: Asset licence audit
        run: python3 game/tools/check_assets_licenses.py game
      - name: Smoke test
        run: |
          set +e
          "$GODOT_DIR/godot" --headless --path game --print-error-trace --script res://tests/smoke_test.gd 2>&1 | tee /tmp/smoke.log
          code=${PIPESTATUS[0]}
          grep -iE 'SCRIPT ERROR|Parse Error|ERROR:|FAIL|Invalid|not found' /tmp/smoke.log 2>/dev/null | head -30 | while read -r line; do echo "::error::$line"; done
          grep -A6 -B1 -i 'SCRIPT ERROR' /tmp/smoke.log 2>/dev/null | head -40 | while read -r line; do echo "::error::TRACE $line"; done
          grep -A14 -i 'Cannot call method' /tmp/smoke.log 2>/dev/null | head -30 | while read -r line; do echo "::error::TRACE $line"; done
          grep -A12 -i 'busy setting up children' /tmp/smoke.log 2>/dev/null | head -20 | while read -r line; do echo "::error::CHILD $line"; done
          if grep -q 'SCRIPT ERROR' /tmp/smoke.log 2>/dev/null; then echo "::error::Runtime script errors detected in smoke test"; exit 1; fi
          exit $code

  build:
    name: Export signed APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la /usr/local/lib/android/sdk 2>&1 | head -20 || true
          find /usr/local/lib/android/sdk/build-tools -maxdepth 2 -type f -name apksigner 2>/dev/null | head -5 || true
          java -version
          mkdir -p "$HOME/.config/godot"
          JAVA_SDK="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
          echo "Java SDK: $JAVA_SDK"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [editor_settings]
          
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_SDK"
          EOF
      - name: Install Godot headless + export templates
        run: |
          mkdir -p "$GODOT_DIR"
          curl -fL --retry 3 -o "$GODOT_DIR/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fL --retry 3 -o "$GODOT_DIR/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q -o "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"
          DEST="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$DEST"
          unzip -q -o "$GODOT_DIR/templates.tpz" -d "$GODOT_DIR/tpl"
          if [ -d "$GODOT_DIR/tpl/templates" ]; then SRC="$GODOT_DIR/tpl/templates"; else SRC="$GODOT_DIR/tpl"; fi
          cp -r "$SRC"/. "$DEST"/
          echo "::notice::Installed templates: $(find "$DEST" -maxdepth 1 -type f -printf '%f ' | head -c 600)"
          test -f "$DEST/android_release.apk" || { echo "::error::android_release.apk missing from export templates"; exit 1; }
          test -f "$DEST/android_debug.apk" || { echo "::error::android_debug.apk missing from export templates"; exit 1; }
          echo "::notice::Template dir: $(ls -la "$DEST" | head -20 | tr '\n' '|')"
          echo "::notice::Template version: $(cat "$DEST/version.txt" 2>/dev/null || echo none)"
          echo "::notice::HOME=$HOME XDG_DATA_HOME=$XDG_DATA_HOME"
      - name: Generate fresh release keystore (not committed)
        run: |
          mkdir -p game/build
          keytool -genkeypair -v -keystore game/build/nova-mira.jks \
            -alias nova -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass NovaMiraDemo2026 -keypass NovaMiraDemo2026 \
            -dname "CN=Nova Mira, OU=Indie, O=Nova Studio, L=Bab Ezzouar, C=DZ" >/dev/null
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$PWD/game/build/nova-mira.jks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=nova" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=NovaMiraDemo2026" >> "$GITHUB_ENV"
      - name: Import + export release APK
        run: |
          mkdir -p build
          "$GODOT_DIR/godot" --headless --path game --import
          "$GODOT_DIR/godot" --headless --path game --export-release "Android" ../build/NovaMira-v0.1.0.apk 2>&1 | tee /tmp/export.log
          test -s build/NovaMira-v0.1.0.apk
          ls -lh build/NovaMira-v0.1.0.apk
      - name: APK size gate (200 MB)
        run: |
          python3 game/tools/check_apk_size.py build/NovaMira-v0.1.0.apk
          echo "::error::APK_SIZE_BYTES=$(stat -c%s build/NovaMira-v0.1.0.apk)"
      - name: Diagnose failed export
        if: failure()
        run: |
          echo "::group::Godot export log"
          cat /tmp/export.log 2>/dev/null || true
          echo "::endgroup::"
          grep -iE 'error|fail|missing|not found|cannot|invalid|script' /tmp/export.log 2>/dev/null | head -25 | while read -r line; do echo "::error::$line"; done
          grep -A18 -i 'configuration errors' /tmp/export.log 2>/dev/null | head -20 | while read -r line; do echo "::error::CFG $line"; done
          echo "::error::Godot Android export failed - see annotations above"
      - name: Verify APK signature and manifest
        run: |
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 -type f | sort | tail -1)
          "$AAPT" dump badging build/NovaMira-v0.1.0.apk | head -20
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort | tail -1)
          "$APKSIGNER" verify --print-certs build/NovaMira-v0.1.0.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaMira-APK
          path: build/NovaMira-v0.1.0.apk
          if-no-files-found: error
      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Nova Mira ${{ github.ref_name }}"
          body: |
            First native Android build of Nova Mira (Godot 4.4.1, ARM64).
            See `docs/TEST_REPORT.md` for real build/test results and
            `KNOWN_LIMITATIONS.md` for what is not implemented yet.
          files: build/NovaMira-v0.1.0.apk
          fail_on_unmatched_files: true

  screenshots:
    name: Capture in-game screenshots
    needs: verify
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot + software GL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          mkdir -p "$GODOT_DIR"
          curl -fL --retry 3 -o "$GODOT_DIR/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q -o "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"
      - name: Render real gameplay frames
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "$GODOT_DIR/godot" --path game --rendering-method gl_compatible \
            --rendering-driver opengl3 --script res://tools/capture_screens.gd 2>&1 | tee /tmp/screens.log
          test -s screenshots/01-main-menu.png
          ls -lh screenshots
      - name: Screenshot log
        if: always()
        run: |
          head -80 /tmp/screens.log 2>/dev/null | while read -r line; do echo "::error::$line"; done || true
          echo "::error::SCREENSHOT_STEP_LOG_END"
      - name: Commit screenshots to branch
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git checkout -B "$GITHUB_REF_NAME"
          git add screenshots
          if git diff --cached --quiet; then echo "No screenshot changes"; else git commit -m "chore(phase1): capture in-game screenshots [skip ci]"; git push origin "$GITHUB_REF_NAME"; fi
