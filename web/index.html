<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<title>Nexus Chat — OpenCode</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#111823; --panel2:#0e141d; --line:#1e2a3a;
    --txt:#e8eef7; --muted:#8ba0b8; --accent:#2f81f7; --accent2:#22c55e;
    --user:#1b2a3f; --bot:#131c28;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1200px 600px at 50% -200px,#16233a 0%,var(--bg) 60%);
    color:var(--txt); font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Kufi Arabic",sans-serif;
    display:flex; flex-direction:column; height:100dvh; overscroll-behavior:none;
  }
  header{
    display:flex; align-items:center; gap:10px; padding:12px 16px;
    border-bottom:1px solid var(--line); background:rgba(11,15,20,.85); backdrop-filter:blur(10px);
    position:sticky; top:0; z-index:5;
  }
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:grid;place-items:center;font-weight:800;font-size:14px}
  .brand{font-weight:800; letter-spacing:.2px}
  .brand small{display:block; font-weight:500; color:var(--muted); font-size:11px}
  .status{margin-inline-start:auto; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:#64748b;transition:.2s}
  .dot.on{background:var(--accent2); box-shadow:0 0 0 4px rgba(34,197,94,.15)}
  .dot.err{background:#ef4444}
  select{
    background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; font-size:13px; max-width:46vw;
  }
  main{flex:1; overflow-y:auto; padding:18px 14px 8px; scroll-behavior:smooth}
  .wrap{max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
  .msg{display:flex; gap:10px; align-items:flex-start; animation:in .18s ease-out}
  @keyframes in{from{opacity:0; transform:translateY(4px)}to{opacity:1;transform:none}}
  .avatar{flex:0 0 28px; width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700}
  .u .avatar{background:var(--user); color:#9ec2ff}
  .a .avatar{background:linear-gradient(135deg,#1f3b2e,#14532d); color:#86efac}
  .bubble{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; max-width:calc(100% - 44px); white-space:pre-wrap; word-break:break-word;
  }
  .u .bubble{background:var(--user); border-color:#24374f}
  .bubble code{background:#0a0f16; padding:2px 5px; border-radius:5px; font-size:.9em}
  .bubble pre{background:#0a0f16; padding:10px; border-radius:10px; overflow:auto; margin:8px 0}
  .bubble pre code{background:none;padding:0}
  .meta{font-size:11px; color:var(--muted); margin-top:6px}
  .cursor::after{content:"▍"; color:var(--accent); animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  footer{padding:10px 14px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(180deg,transparent,rgba(11,15,20,.9))}
  .composer{max-width:820px; margin:0 auto; display:flex; gap:8px; align-items:flex-end;
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:8px; }
  textarea{
    flex:1; resize:none; border:0; outline:0; background:transparent; color:var(--txt);
    font:inherit; padding:8px; max-height:40dvh; min-height:24px;
  }
  button{font:inherit; border:0; cursor:pointer; border-radius:12px}
  #send{background:var(--accent); color:#fff; padding:10px 18px; font-weight:700; min-width:76px}
  #send:disabled{opacity:.5; cursor:not-allowed}
  #stop{background:#7f1d1d; color:#fff; padding:10px 14px; display:none}
  .hint{max-width:820px;margin:8px auto 0;color:var(--muted);font-size:11px;text-align:center}
  .empty{color:var(--muted); text-align:center; padding:36px 10px}
  .empty h1{font-size:20px;color:var(--txt);margin:0 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:999px;font-size:13px}
  .err{color:#fca5a5;font-size:13px;text-align:center;padding:6px}
</style>
</head>
<body>
<header>
  <div class="logo">N</div>
  <div class="brand">Nexus Chat <small>على سيرفر OpenCode</small></div>
  <select id="model" title="النموذج"></select>
  <div class="status"><span id="dot" class="dot"></span><span id="statusTxt">جارٍ الاتصال…</span></div>
</header>

<main id="main">
  <div class="wrap" id="wrap">
    <div class="empty" id="empty">
      <h1>مرحبا 👋</h1>
      <div>اكتب سؤالك وسيرفر OpenCode يجاوبك مباشرة هنا.</div>
      <div class="chips">
        <button class="chip" data-q="اشرح لي الفرق بين TCP و UDP باختصار">TCP vs UDP</button>
        <button class="chip" data-q="أعطني فكرة مشروع بسيط بـ HTML و JavaScript">فكرة مشروع</button>
        <button class="chip" data-q="اكتب لي دالة بايثون تحسب الأعداد الأولية">كود بايثون</button>
        <button class="chip" data-q="قولي حاجة مليحة نعملها اليوم في الجزائر">نصيحة</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="اكتب رسالتك هنا…" enterkeyhint="send"></textarea>
    <button id="stop" title="إيقاف">■</button>
    <button id="send" title="إرسال (Enter)">إرسال</button>
  </div>
  <div class="hint" id="hint">Enter يرسل · Shift+Enter سطر جديد</div>
</footer>

<script type="module">
const $ = (s) => document.querySelector(s);
const wrap = $("#wrap"), main = $("#main"), input = $("#input");
const sendBtn = $("#send"), stopBtn = $("#stop");
const modelSel = $("#model"), dot = $("#dot"), statusTxt = $("#statusTxt"), hint = $("#hint");

const API = ""; // same origin: the gateway proxies to opencode
let sessionID = null;
let model = null;
let streaming = false;
let es = null;
let currentMsgEl = null;

// ---------- tiny markdown-ish renderer (fast, safe) ----------
function esc(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function render(text){
  const parts = [];
  const re = /```([\w-]*)\n?([\s\S]*?)```/g;
  let last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) parts.push({code:false, text: text.slice(last, m.index)});
    parts.push({code:true, text:m[2], lang:m[1]});
    last = re.lastIndex;
  }
  if (last < text.length) parts.push({code:false, text:text.slice(last)});
  return parts.map(p => {
    if (p.code) return `<pre><code>${esc(p.text)}</code></pre>`;
    return esc(p.text)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  }).join("");
}

function scroll(){ main.scrollTop = main.scrollHeight; }

function addMsg(role, text){
  $("#empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + (role === "user" ? "u" : "a");
  el.innerHTML = `<div class="avatar">${role === "user" ? "أنت" : "AI"}</div>
                  <div class="bubble"><div class="content"></div></div>`;
  el.querySelector(".content").innerHTML = role === "user" ? esc(text) : "";
  wrap.appendChild(el);
  scroll();
  return el;
}

function setText(el, text, done){
  const c = el.querySelector(".content");
  c.innerHTML = render(text);
  c.classList.toggle("cursor", !done);
  scroll();
}

function setStatus(kind, label){
  dot.className = "dot" + (kind === "on" ? " on" : kind === "err" ? " err" : "");
  statusTxt.textContent = label;
}

// ---------- boot ----------
async function jget(url, opts){
  const r = await fetch(API + url, opts);
  if (!r.ok) throw new Error(`${r.status} ${url}`);
  return r.json();
}

async function boot(){
  try{
    const health = await jget("/api/health");
    setStatus("on", "متصل");
  }catch(e){
    setStatus("err", "السيرفر ما جاوبش"); 
    console.error(e);
  }
  // models
  try{
    const { data } = await jget("/api/model");
    const usable = data.filter(m => m.enabled && m.status !== "deprecated");
    const free = usable.filter(m => (m.cost?.[0]?.input ?? 1) === 0);
    const list = (free.length ? free : usable);
    modelSel.innerHTML = list.map(m => `<option value="${m.providerID}|${m.id}">${esc(m.name || m.id)}</option>`).join("");
    const pref = list.find(m => m.id === "big-pickle") || list.find(m => /free/.test(m.id)) || list[0];
    if (pref){ model = { providerID: pref.providerID, id: pref.id }; modelSel.value = `${pref.providerID}|${pref.id}`; }
  }catch(e){ console.warn("models failed", e); }

  modelSel.onchange = () => {
    const [providerID, id] = modelSel.value.split("|");
    model = { providerID, id };
  };
}

async function ensureSession(){
  if (sessionID) return sessionID;
  const { data } = await jget("/api/session", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ model: model || undefined }),
  });
  sessionID = data.id;
  return sessionID;
}

function subscribe(sid){
  es?.close();
  es = new EventSource(`/api/session/${sid}/event`);
  es.onopen = () => setStatus("on", "متصل · بث حي");
  es.onerror = () => setStatus("err", "انقطع البث، نعيد…");
  es.onmessage = (ev) => {
    let e; try { e = JSON.parse(ev.data); } catch { return; }
    handleEvent(e);
  };
}

let acc = "";
function handleEvent(e){
  const t = e.type || "";
  const d = e.data || {};
  if (t.endsWith("step.started")){
    if (!currentMsgEl) currentMsgEl = addMsg("assistant", "");
    acc = ""; setText(currentMsgEl, "…", false);
  } else if (t.endsWith("text.delta") || t.endsWith("reasoning.delta")){
    const chunk = d.delta ?? d.text ?? d.content ?? "";
    if (!chunk) return;
    if (!currentMsgEl) currentMsgEl = addMsg("assistant", "");
    acc += chunk; setText(currentMsgEl, acc, false);
  } else if (t.endsWith("text.ended") || t.endsWith("step.ended")){
    if (currentMsgEl) setText(currentMsgEl, acc, true);
  } else if (t.endsWith("step.failed")){
    const msg = d.error?.message || d.error?.type || "خطأ";
    if (!currentMsgEl) currentMsgEl = addMsg("assistant", "");
    setText(currentMsgEl, `⚠️ ${msg}`, true);
    finish();
  } else if (t === "session.idle" || t === "session.next.idle"){
    if (currentMsgEl) setText(currentMsgEl, acc, true);
    finish();
  }
}

function finish(){
  streaming = false;
  sendBtn.disabled = false;
  stopBtn.style.display = "none";
  currentMsgEl = null;
  acc = "";
}

async function send(text){
  if (streaming || !text.trim()) return;
  streaming = true;
  sendBtn.disabled = true;
  stopBtn.style.display = "block";
  addMsg("user", text);
  input.value = ""; input.style.height = "auto";
  currentMsgEl = null; acc = "";

  try{
    const sid = await ensureSession();
    subscribe(sid);
    const body = { prompt: { text } };
    if (model) body.model = model;
    const r = await fetch(`/api/session/${sid}/prompt`, {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(await r.text());
    setStatus("on", "يفكر…");
  }catch(err){
    const el = addMsg("assistant", "");
    setText(el, `⚠️ ما قدرتش نرسل: ${err.message}`, true);
    finish();
    setStatus("err", "خطأ في الإرسال");
  }
}

// ---------- ui ----------
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, innerHeight * 0.4) + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(input.value); }
});
sendBtn.onclick = () => send(input.value);
stopBtn.onclick = async () => {
  if (!sessionID) return;
  try{ await fetch(`/api/session/${sessionID}/interrupt`, { method: "POST" }); }catch{}
  finish();
};
document.addEventListener("click", (e) => {
  const c = e.target.closest(".chip");
  if (c) send(c.dataset.q);
});

boot();
</script>
</body>
</html>
