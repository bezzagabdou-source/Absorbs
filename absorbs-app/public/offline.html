<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070713" />
    <title>Absorbs — غير متصل</title>
    <style>
      * { margin: 0; box-sizing: border-box; font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; }
      body { min-height: 100dvh; background: #05060f; color: #f4f4fa; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }
      .orb { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .55; pointer-events: none; }
      .a { width: 420px; height: 420px; top: -140px; right: -100px; background: radial-gradient(circle, rgba(139,92,246,.6), transparent 65%); }
      .b { width: 380px; height: 380px; bottom: -120px; left: -80px; background: radial-gradient(circle, rgba(8,145,178,.55), transparent 65%); }
      .card { position: relative; max-width: 380px; width: 100%; text-align: center; padding: 36px 26px; border-radius: 30px;
        background: linear-gradient(150deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
        border: 1px solid rgba(255,255,255,.09); backdrop-filter: blur(20px); box-shadow: 0 24px 60px rgba(0,0,0,.5); }
      .logo { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 22px; display: flex; align-items: center; justify-content: center;
        font-size: 30px; font-weight: 900; color: #fff;
        background: radial-gradient(120% 120% at 15% 10%, rgba(255,255,255,.5), transparent 45%), linear-gradient(140deg, #8b5cf6, #d946ef 52%, #0891b2);
        box-shadow: 0 14px 36px rgba(168,85,247,.45); }
      h1 { font-size: 22px; font-weight: 900; }
      p { margin-top: 10px; font-size: 14px; line-height: 1.9; color: rgba(255,255,255,.6); }
      button { margin-top: 22px; border: 0; cursor: pointer; padding: 13px 34px; border-radius: 999px; color: #fff; font-size: 15px; font-weight: 800;
        background: linear-gradient(135deg, #8b5cf6, #d946ef 55%, #06b6d4 130%); box-shadow: 0 10px 30px rgba(168,85,247,.4); }
      button:active { transform: scale(.97); }
    </style>
  </head>
  <body>
    <div class="orb a"></div><div class="orb b"></div>
    <main class="card">
      <div class="logo">A</div>
      <h1>انقطع الاتصال 🌙</h1>
      <p>يبدو أن الإنترنت غير متاح الآن. منشوراتك ورسائلك بأمان في Absorbs — عد للاتصال وستجد كل شيء محدثًا لحظيًا.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
