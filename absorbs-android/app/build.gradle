plugins {
    id 'com.android.application'
}

android {
    namespace 'dz.absorbs.app'
    compileSdk 34

    defaultConfig {
        applicationId 'dz.absorbs.app'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

// Fix "Duplicate class kotlin.streams.jdk8..." dex errors:
// since Kotlin 1.8 the jdk7/jdk8 stdlib classes live inside kotlin-stdlib
// itself, so the legacy split artifacts must be excluded and the version aligned.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    }
}
