app = "ft-ai-quiz-bot"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DB_PATH = "/data/ftai.db"
  PROTECTION_LEVEL = "max"

[[mounts]]
  source = "ftai_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [[http_service.checks.http]]
      path = "/healthz"
      interval = "30s"
      timeout = "5s"
