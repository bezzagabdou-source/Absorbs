name: Montage Direct MP4 URL
# Sandbox egress is limited to github.com, so a GitHub Actions runner fetches the
# user's direct MP4 link, renders it with the studio committed here, and pushes
# the finished montage back to THIS SAME BRANCH (never any other branch).
on:
  push:
    branches: [arena/ecff9abf-absorbs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  montage:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message || '', '[montage-url]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_URL: 'https://www.image2url.com/r2/default/videos/1793744278259-bf9535b0-acc5-4e41-ae44-a6a1891f0a69.mp4'
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          ref: arena/ecff9abf-absorbs
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the legendary stack
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r legendary-studio/requirements.txt
          FFBIN=$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')
          echo "FFMPEG_BINARY=$FFBIN" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ffbin"
          ln -sf "$FFBIN" "$RUNNER_TEMP/ffbin/ffmpeg"
          echo "$RUNNER_TEMP/ffbin" >> "$GITHUB_PATH"
          mkdir -p legendary-studio/out legendary-studio/downloads

      - name: Download source MP4
        run: |
          set +e
          {
            echo "SOURCE_URL=$SOURCE_URL"
            UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
            BASE='https://www.image2url.com'
            OUT='legendary-studio/out/source_url.mp4'
            ENC=$(python -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['SOURCE_URL'],safe=''))")
            rm -f "$OUT" "$OUT.tmp"
            curl -sS -L --max-time 30 -A "$UA" -c /tmp/cj "$BASE/" -o /dev/null -w "homepage: %{http_code}\n" || true
            try () {
              label="$1"; url="$2"; shift 2
              info=$(curl -sS -L --max-time 180 -A "$UA" "$@" -o "$OUT.tmp" \
                     -w "%{http_code}|%{content_type}|%{size_download}" "$url" 2>>/tmp/curlerr)
              echo "$label -> $info | curlerr=$(tail -c 160 /tmp/curlerr 2>/dev/null)"
              echo "  first bytes: $(head -c 120 "$OUT.tmp" 2>/dev/null | tr -cd '[:print:]' | head -c 120)"
              if echo "$info" | grep -q '^200|' && [ -s "$OUT.tmp" ] \
                 && head -c 12 "$OUT.tmp" | grep -aq ftyp; then
                cp "$OUT.tmp" "$OUT"; echo "SUCCESS:$label"; return 0
              fi
              return 1
            }
            H=(-e "$BASE/" -H "Origin: $BASE" -H "Accept: video/mp4,application/octet-stream,*/*"
               -H "Accept-Language: en-US,en;q=0.9" -H "Sec-Fetch-Dest: video"
               -H "Sec-Fetch-Mode: no-cors" -H "Sec-Fetch-Site: same-origin" -b /tmp/cj)
            try "browser-full" "$SOURCE_URL" "${H[@]}" \
            || try "range" "$SOURCE_URL" -e "$BASE/" -b /tmp/cj -H 'Range: bytes=0-' -H 'Accept: */*' \
            || try "no-www" "$(echo "$SOURCE_URL" | sed 's#www\.##')" "${H[@]}" \
            || try "download-param" "$SOURCE_URL?download=1" "${H[@]}" \
            || try "http" "$(echo "$SOURCE_URL" | sed 's#^https://#http://#')" "${H[@]}" \
            || try "allorigins" "https://api.allorigins.win/raw?url=$ENC" \
            || try "codetabs" "https://api.codetabs.com/v1/proxy?quest=$ENC" \
            || try "corsproxy" "https://corsproxy.io/?url=$ENC"
            echo "=== last response body preview ==="
            head -c 700 "$OUT.tmp" 2>/dev/null | strings | head -20
            if [ ! -s "$OUT" ]; then
              python legendary-studio/download_reel.py --direct "$SOURCE_URL" -o "$OUT" || true
            fi
            ls -lh "$OUT" 2>/dev/null || echo "NO FILE"
            [ -s "$OUT" ] && PYTHONPATH=legendary-studio python -c "from legendary.ffmpeg import probe; print('PROBE', probe('$OUT'))"
          } 2>&1 | tee legendary-studio/downloads/URL_LOG.txt
          test -s legendary-studio/out/source_url.mp4

      - name: LEGENDARY montage
        run: |
          {
            PYTHONPATH=legendary-studio python -m legendary.cli \
              -i legendary-studio/out/source_url.mp4 \
              -o legendary-studio/downloads/URL_LEGENDARY.mp4 \
              --preset fantasy --crf 19 --x264-preset veryfast \
              --max-duration 60 --fps 30 \
              --title "مونتاج أسطوري" --subtitle "الأسطورة تبدأ الآن" \
              --outro "ABSORBS · LEGENDARY CUT" \
              --json > legendary-studio/downloads/URL_REPORT.json
            ls -lh legendary-studio/downloads/URL_LEGENDARY.mp4
          } 2>&1 | tee -a legendary-studio/downloads/URL_LOG.txt

      - name: Publish MP4 + status to this same branch
        if: always()
        run: |
          git config user.name "arena-reel-bot"
          git config user.email "arena-reel-bot@users.noreply.github.com"
          if [ -f legendary-studio/downloads/URL_LEGENDARY.mp4 ]; then
            echo "STATUS=ok" > legendary-studio/downloads/URL_STATUS.txt
            echo "SOURCE=$SOURCE_URL" >> legendary-studio/downloads/URL_STATUS.txt
            git add -f legendary-studio/downloads/URL_LEGENDARY.mp4 \
                       legendary-studio/downloads/URL_REPORT.json \
                       legendary-studio/downloads/URL_STATUS.txt
          else
            echo "STATUS=failed" > legendary-studio/downloads/URL_STATUS.txt
            git add legendary-studio/downloads/URL_STATUS.txt
          fi
          [ -f legendary-studio/downloads/URL_LOG.txt ] && git add -f legendary-studio/downloads/URL_LOG.txt || true
          git commit -m "chore(url-montage): publish result [skip ci]" || echo "nothing to commit"
          git push origin HEAD:arena/ecff9abf-absorbs || true
