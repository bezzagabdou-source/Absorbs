name: Build Dz connect Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "absorbs-android/**"
      - ".github/workflows/absorbs-apk.yml"

permissions:
  contents: write
  issues: write

jobs:
  build-apk:
    name: Build & publish DZConnect.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        working-directory: absorbs-android
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Gradle · resolve dependencies
        working-directory: absorbs-android
        run: |
          set -o pipefail
          ./gradlew :app:preDebugBuild --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Gradle · process resources (AAPT)
        working-directory: absorbs-android
        run: |
          set -o pipefail
          ./gradlew :app:processDebugResources --stacktrace 2>&1 | tee -a ../gradle-build.log

      - name: Gradle · compile Java
        working-directory: absorbs-android
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugJavaWithJavac --stacktrace 2>&1 | tee -a ../gradle-build.log

      - name: Build debug APK (installable, debug-signed)
        working-directory: absorbs-android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a ../gradle-build.log

      - name: Upload Gradle build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Report failure as issue (diagnostics)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}";
            echo; echo '```'; tail -c 5000 gradle-build.log || true; echo '```';
          } > issue-body.md
          gh issue create --title "APK build failure — diagnostics" --body-file issue-body.md || true

      - name: Prepare Absorbs.apk
        run: |
          cp absorbs-android/app/build/outputs/apk/debug/app-debug.apk ./DZConnect.apk
          ls -lh ./DZConnect.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DZConnect-apk
          path: ./DZConnect.apk
          if-no-files-found: error

      - name: Publish to GitHub Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dz-connect-v1.3.0
          name: "Dz connect Android v1.3.0"
          body: |
            📱 **تطبيق Dz connect للأندرويد** — حمّل ملف `DZConnect.apk` وثبّته مباشرة.
            عند التثبيت فعّل «السماح من هذا المصدر» (APK تجريبي موقّع بمفتاح Debug).
            يفتح التطبيق النسخة الحية من Dz connect: https://absorbs-app-abdoubita986-gif.vercel.app
          files: ./DZConnect.apk
          fail_on_unmatched_files: true
