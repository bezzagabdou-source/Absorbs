name: Build Dz connect Android (Native)

on:
  workflow_dispatch:
  push:
    paths:
      - "absorbs-android/**"
      - ".github/workflows/absorbs-apk.yml"

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Native APK + AAB (release-signed when secrets exist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK platform 37 (for compileSdk 37)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" || true

      - name: Generate Gradle wrapper
        working-directory: absorbs-android
        run: |
          set -o pipefail
          gradle wrapper --gradle-version 9.6.0 --distribution-type bin 2>&1 | tee ../gradle-build.log

      - name: Check signing secrets
        id: sig
        env:
          KS: ${{ secrets.DZ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Decode upload keystore (from secrets)
        if: steps.sig.outputs.signed == 'true'
        env:
          KS: ${{ secrets.DZ_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/dz-upload.p12"

      - name: Build signed Release APK + AAB
        if: steps.sig.outputs.signed == 'true'
        working-directory: absorbs-android
        env:
          DZ_KEYSTORE_FILE: ${{ runner.temp }}/dz-upload.p12
          DZ_KEYSTORE_PASSWORD: ${{ secrets.DZ_KEYSTORE_PASSWORD }}
          DZ_KEY_ALIAS: ${{ secrets.DZ_KEY_ALIAS }}
          DZ_KEY_PASSWORD: ${{ secrets.DZ_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Build fallback APK (no secrets yet — unsigned RELEASE, signed before distribution)
        if: steps.sig.outputs.signed != 'true'
        working-directory: absorbs-android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Deposit unsigned APK into repo transport (no-secrets path only)
        if: steps.sig.outputs.signed != 'true'
        run: |
          mkdir -p absorbs-android/transport
          cp absorbs-android/app/build/outputs/apk/release/app-release-unsigned.apk absorbs-android/transport/DZConnect-unsigned.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add absorbs-android/transport/DZConnect-unsigned.apk
          if git diff --cached --quiet; then
            echo "transport APK unchanged"
          else
            git commit -m "transport: unsigned v3.0.0 APK for permanent-key signing [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Verify signature & collect outputs
        run: |
          set -o pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if [ "${{ steps.sig.outputs.signed }}" = "true" ]; then
            cp absorbs-android/app/build/outputs/apk/release/app-release.apk ./DZConnect.apk
            cp absorbs-android/app/build/outputs/bundle/release/app-release.aab ./DZConnect.aab
            "$APKSIGNER" verify --print-certs ./DZConnect.apk 2>&1 | tee signature.txt
          elif [ -f absorbs-android/transport/DZConnect.apk ]; then
            # Permanent-key signed APK deposited in transport/ — it is the
            # authoritative downloadable build until CI secrets exist.
            cp absorbs-android/transport/DZConnect.apk ./DZConnect.apk
            "$APKSIGNER" verify --print-certs ./DZConnect.apk 2>&1 | tee signature.txt
          else
            cp absorbs-android/app/build/outputs/apk/release/app-release-unsigned.apk ./DZConnect.apk
            echo "UNSIGNED RELEASE BUILD — awaiting permanent-key signed APK in transport/" > signature.txt
          fi
          ls -lh DZConnect*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DZConnect-native
          path: |
            ./DZConnect.apk
            ./DZConnect.aab
            ./signature.txt
          if-no-files-found: ignore

      - name: Upload Gradle build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Report failure as issue (diagnostics)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}";
            echo; echo '```'; grep -E "^e: |error:|FAILURE|What went wrong" -A2 gradle-build.log | head -80 || true;
            echo; echo '--- signature.txt ---'; cat signature.txt 2>/dev/null || true;
            echo; echo '--- tail ---'; tail -c 1800 gradle-build.log || true; echo '```';
          } > issue-body.md
          gh issue create --title "Native APK build failure — diagnostics" --body-file issue-body.md || true

      - name: Publish to GitHub Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dz-connect-v3.0.0
          name: "Dz connect Android v3.0.0 — Compose Native"
          body: |
            📱 **Dz connect v3.0.0 — تطبيق Android أصلي بالكامل (Jetpack Compose)** ماشي WebView: خلاصة وقصص وريلز بفيديو حقيقي، رسائل فورية (Realtime + حضور + «يكتب الآن…»)، Dz connect ai، ملفات شخصية كاملة، بحث واستكشاف، إنشاء منشورات بفلاتر وضغط صور، ثلاث لغات (عربي RTL / فرنسية / إنجليزية) ووضع داكن.
            حمّل `DZConnect.apk` وثبّته مباشرة. إذا عندك نسخة قديمة بتوقيع مختلف احذفها أولًا.
            ملف `DZConnect.aab` مخصّص للرفع على Google Play Console.
          files: |
            ./DZConnect.apk
            ./DZConnect.aab
          fail_on_unmatched_files: false
