name: Verify and Publish Signed APK

on:
  push:
    branches: [arena/f205ded0-absorbs]
    paths:
      - 'marketplace/public/DZ-Exchange.apk'
      - '.github/workflows/publish-signed-apk.yml'
      - '.github/scripts/emulator-test.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify signature and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build-tools
        run: |
          SDK="${RUNNER_TEMP}/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/ct.zip
          unzip -q /tmp/ct.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0" >/dev/null
          echo "BT=$SDK/build-tools/35.0.0" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Verify the signed APK with official tooling
        run: |
          APK=marketplace/public/DZ-Exchange.apk
          mkdir -p android/ci-output
          {
            echo "############ apksigner verify --verbose --print-certs ############"
            "$BT/apksigner" verify --verbose --print-certs "$APK"
            echo
            echo "############ zipalign -c -v 4 ############"
            "$BT/zipalign" -c -v 4 "$APK" | tail -4
            echo
            echo "############ aapt dump badging ############"
            "$BT/aapt" dump badging "$APK"
            echo
            echo "############ aapt dump permissions ############"
            "$BT/aapt" dump permissions "$APK"
            echo
            echo "############ manifest flags ############"
            "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml \
              | grep -E 'application \(|android:debuggable|android:allowBackup|android:usesCleartextTraffic|android:label|android:icon'
            echo
            echo "############ assertions ############"
            "$BT/apksigner" verify --verbose "$APK" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' && echo "PASS v2 signature"
            "$BT/apksigner" verify --verbose "$APK" | grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' && echo "PASS v3 signature"
            if "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q 'android:debuggable'; then
              echo "FAIL: debuggable present"; exit 1
            else echo "PASS debuggable=false (flag absent)"; fi
            PERMS=$("$BT/aapt" dump permissions "$APK" | grep -c '^uses-permission:')
            test "$PERMS" = "2" && echo "PASS exactly 2 permissions"
            echo
            echo "############ SHA-256 ############"
            sha256sum "$APK"
            stat -c '%s bytes' "$APK"
          } | tee android/ci-output/final-verification.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: DZ Exchange 1.0 (signed release)
          body: |
            Signed **release** Android app for https://marketplace-fixed.vercel.app

            - package: `app.dzexchange.marketplace`
            - versionName 1.0 + versionCode 1, minSdk 23, targetSdk 35
            - `debuggable=false`, `allowBackup=false`, `usesCleartextTraffic=false`
            - permissions: INTERNET, ACCESS_NETWORK_STATE only
            - signature schemes: v1 + v2 + v3 (RSA 4096, private release key, valid until 2056)
            - WebView is restricted to `marketplace-fixed.vercel.app`; other links open in the browser
          files: marketplace/public/DZ-Exchange.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: curl -I download tests
        run: |
          {
            echo "############ curl -I GitHub Releases (primary) ############"
            curl -sSIL --max-time 60 \
              https://github.com/${{ github.repository }}/releases/download/v1.0/DZ-Exchange.apk \
              | grep -Ei '^HTTP/|^content-type:|^content-length:|^content-disposition:|^location:'
            echo
            echo "############ curl -I Vercel public (mirror) ############"
            for i in 1 2 3 4 5 6 7 8; do
              OUT=$(curl -sSI --max-time 30 https://marketplace-fixed.vercel.app/DZ-Exchange.apk)
              echo "$OUT" | grep -Ei '^HTTP/|^content-type:|^content-length:|^content-disposition:'
              if echo "$OUT" | grep -qi 'application/vnd.android.package-archive'; then break; fi
              echo "...waiting for Vercel deploy ($i)"; sleep 25
            done
            echo
            echo "############ byte-for-byte download check ############"
            curl -sSL --max-time 120 -o /tmp/gh.apk https://github.com/${{ github.repository }}/releases/download/v1.0/DZ-Exchange.apk
            curl -sSL --max-time 120 -o /tmp/vc.apk https://marketplace-fixed.vercel.app/DZ-Exchange.apk
            sha256sum marketplace/public/DZ-Exchange.apk /tmp/gh.apk /tmp/vc.apk
            cmp marketplace/public/DZ-Exchange.apk /tmp/gh.apk && echo "PASS GitHub asset identical"
            cmp marketplace/public/DZ-Exchange.apk /tmp/vc.apk && echo "PASS Vercel asset identical"
          } | tee -a android/ci-output/final-verification.txt

      - name: Commit verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f android/ci-output/final-verification.txt
          git commit -m "ci(android): signed APK verification report [skip ci]" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

  emulator:
    name: Install and launch on API ${{ matrix.api }} emulator
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install and launch the signed APK
        run: bash .github/scripts/emulator-test.sh ${{ matrix.api }}

      - name: Commit emulator evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in android/ci-output/emulator-log-api*.txt android/ci-output/emulator-console-api*.txt; do
            [ -f "$f" ] || continue
            tail -n 400 "$f" > "$f.trim" && mv "$f.trim" "$f"
          done
          git add -f android/ci-output/emulator-* 2>/dev/null || true
          git commit -m "ci(android): API ${{ matrix.api }} emulator evidence [skip ci]" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep 5
          done
