name: opencode server tunnel

# Public, self-healing endpoint: a small chat website + the OpenCode API on ONE origin.
#
#   opencode serve (127.0.0.1:8081)  ->  gateway that also serves web/ (0.0.0.0:8080)  ->  cloudflare tunnel
#
# The tunnel root ( https://<host>/ ) is the chat page; the same origin proxies
# /api/*, /session, /event ... to opencode, so there is no cross-origin problem at all.
#
# The gateway exists because opencode itself answers no CORS headers for unknown
# origins, which leaves the app stuck on "Connecting..." (REST works, the SSE stream
# is blocked). The supervisor heals dead processes and republishes the tunnel host.
#
# Discover the live URL:  commit status `opencode/url` on this branch,
# or Actions -> this run -> Summary.

on:
  push:
    branches: [arena/3d01ef96-absorbs]
    paths:
      - '.github/workflows/opencode-tunnel.yml'
      - 'scripts/**'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: opencode-tunnel
  cancel-in-progress: true

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install opencode + cloudflared
        run: |
          set -eux
          npm install -g opencode-ai@latest > /dev/null 2>&1
          opencode --version
          node --version
          sudo curl -fsSL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: supervise server + gateway + tunnel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # optional: add any of these as repository secrets and opencode enables that
          # provider automatically (keyless opencode free tier is used when none is set)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: bash scripts/opencode-supervisor.sh

      - name: logs on failure
        if: failure()
        run: |
          echo "=== cloudflared ==="; tail -40 /tmp/tunnel/cf.log || true
          echo "=== gateway ==="; tail -40 /tmp/tunnel/gw.log || true
          echo "=== opencode ==="; tail -40 /tmp/tunnel/oc.log || true
