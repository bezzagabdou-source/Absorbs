name: Deploy chat site (GitHub Pages)

# Static site, no server and no tunnel: the page calls a keyless LLM directly
# from the browser. Deployed on every push that touches web-pages/.

on:
  push:
    branches: [arena/3d01ef96-absorbs, main]
    paths:
      - 'web-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: enable pages (first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: build artifact
        run: |
          mkdir -p _site
          cp -r web-pages/. _site/
          # make sure the entry point exists
          test -f _site/index.html
          # no caching surprises while iterating
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
