name: Deploy chat site (GitHub Pages)

# Static site, no server and no tunnel: the page calls a keyless LLM directly
# from the browser. Deployed on every push that touches web-pages/.

on:
  push:
    branches: [arena/3d01ef96-absorbs, main]
    paths:
      - 'web-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# writes the site to the docs/ folder on this branch, so GitHub Pages can serve it
# straight from the repository (branch source: /docs) without any build step.

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: copy site into docs/
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r web-pages/. docs/
          test -f docs/index.html
          printf 'User-agent: *\nAllow: /\n' > docs/robots.txt
          printf '' > docs/.nojekyll
          ls -la docs

      - name: commit
        run: |
          git config user.name "nexus-bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(pages): publish chat site to /docs"
            git push
          fi
