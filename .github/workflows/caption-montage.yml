name: Caption + Sticker Montage (quality only)
# NO cuts / NO speed ramps / NO added music. Original timeline + audio kept.
# Transcribes speech (faster-whisper), burns Arabic captions, adds keyword
# stickers, and only improves picture quality. Publishes to this same branch.
on:
  push:
    branches: [arena/ecff9abf-absorbs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  captions:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message || '', '[captions]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_URL: 'https://www.image2url.com/r2/default/videos/1793744278259-bf9535b0-acc5-4e41-ae44-a6a1891f0a69.mp4'
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          ref: arena/ecff9abf-absorbs
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install stack
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r legendary-studio/requirements.txt curl_cffi faster-whisper
          FFBIN=$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')
          echo "FFMPEG_BINARY=$FFBIN" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ffbin"
          ln -sf "$FFBIN" "$RUNNER_TEMP/ffbin/ffmpeg"
          echo "$RUNNER_TEMP/ffbin" >> "$GITHUB_PATH"
          mkdir -p legendary-studio/out legendary-studio/downloads

      - name: Download the ORIGINAL video (Cloudflare bypass)
        run: |
          PYTHONPATH=legendary-studio SOURCE_OUT='legendary-studio/out/source_original.mp4' \
            python legendary-studio/legendary/cloudflare_fetch.py
          ls -lh legendary-studio/out/source_original.mp4
          test -s legendary-studio/out/source_original.mp4

      - name: Transcribe + captions + stickers + quality pass
        run: |
          PYTHONPATH=legendary-studio python -m legendary.captions \
            -i legendary-studio/out/source_original.mp4 \
            -o legendary-studio/downloads/CAPTION_LEGENDARY.mp4 \
            --workdir legendary-studio/downloads/_captions
          ls -lh legendary-studio/downloads/CAPTION_LEGENDARY.mp4
          echo "=== transcript ==="
          python -c "import json;d=json.load(open('legendary-studio/downloads/_captions/TRANSCRIPT.json'));print(d['text'][:600])"
          echo "=== captions ==="
          cat legendary-studio/downloads/_captions/CAPTIONS.srt | head -40

      - name: Lite copy (small, fast to open)
        run: |
          ffmpeg -y -loglevel error -i legendary-studio/downloads/CAPTION_LEGENDARY.mp4 \
            -vf 'scale=540:960:flags=lanczos' -c:v libx264 -preset veryfast -crf 27 \
            -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart \
            legendary-studio/downloads/CAPTION_LEGENDARY_LITE.mp4
          ls -lh legendary-studio/downloads/CAPTION_LEGENDARY*.mp4

      - name: Publish + verified mirrors
        run: |
          set +e
          D='legendary-studio/downloads'
          F="$D/CAPTION_LEGENDARY.mp4"
          L="$D/CAPTION_LEGENDARY_LITE.mp4"
          cp "$D/_captions/TRANSCRIPT.json" "$D/TRANSCRIPT.json"
          cp "$D/_captions/CAPTIONS.srt" "$D/CAPTIONS.srt"
          cp "$D/_captions/CAPTION_REPORT.json" "$D/CAPTION_REPORT.json"
          M="$D/CAPTION_LINKS.txt"
          : > "$M"
          {
            echo "# CAPTION + STICKER MONTAGE — verified direct links"
            echo "# captions/stickers follow the speech; NO cuts, NO speed change"
            echo "# generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "GITHUB (permanent, available after this commit is pushed)"
            echo "INFO https://raw.githubusercontent.com/bezzagabdou-source/Absorbs/arena/ecff9abf-absorbs/legendary-studio/downloads/CAPTION_LEGENDARY.mp4"
            echo "INFO https://raw.githubusercontent.com/bezzagabdou-source/Absorbs/arena/ecff9abf-absorbs/legendary-studio/downloads/CAPTION_LEGENDARY_LITE.mp4"
            echo "GITHUB RELEASE"
            echo "LINK https://github.com/bezzagabdou-source/Absorbs/releases/download/v-legendary-2/CAPTION_LEGENDARY.mp4"
            echo "LINK https://github.com/bezzagabdou-source/Absorbs/releases/download/v-legendary-2/CAPTION_LEGENDARY_LITE.mp4"
            echo "INDEPENDENT MIRRORS"
          } >> "$M"

          echo "=== uguu.se ==="
          for f in "$F" "$L"; do
            UG=$(curl -sS --max-time 300 -A "Mozilla/5.0" -F "files[]=@$f" https://uguu.se/upload.php 2>&1 | tail -c 800)
            echo "uguu $(basename "$f"): $UG" | tee -a "$M"
            echo "$UG" | python -c "
          import sys,re
          m=re.search(r'\"url\"\s*:\s*\"([^\"]+)\"',sys.stdin.read())
          if m: print('LINK '+m.group(1).replace(chr(92)+'/','/'))
          " >> "$M" 2>/dev/null
          done

          echo "=== filebin.net ==="
          BIN="captioned$(date +%s)"
          for f in "$F" "$L"; do
            n=$(basename "$f")
            curl -sS --max-time 300 --upload-file "$f" "https://filebin.net/$BIN/$n" \
              -o /dev/null -w "filebin $n: %{http_code}\n" | tee -a "$M"
            echo "LINK https://filebin.net/$BIN/$n" >> "$M"
          done

          echo "=== GitHub Release ==="
          gh release create v-legendary-2 "$F" "$L" \
            --target arena/ecff9abf-absorbs \
            --title "CAPTION + STICKER MONTAGE — quality only" \
            --notes "Arabic captions + keyword stickers, original timeline preserved." \
            || gh release upload v-legendary-2 "$F" "$L" --clobber \
            || echo "release upload failed"

          echo ""
          echo "=== VERIFICATION ==="
          cp "$M" /tmp/caption_snapshot.txt
          grep '^LINK ' /tmp/caption_snapshot.txt | awk '{print $2}' | sort -u | while read -r u; do
            code=$(curl -sS -L --max-time 60 -r 0-1023 -o /dev/null \
                   -w "%{http_code}|%{content_type}|%{size_download}" "$u" 2>/dev/null || echo "ERR")
            echo "$code  $u" | tee -a "$M"
          done
          echo ""
          cat "$M"

          git config user.name "arena-reel-bot"
          git config user.email "arena-reel-bot@users.noreply.github.com"
          git add -f "$F" "$L" "$D/CAPTIONS.srt" "$D/TRANSCRIPT.json" \
                     "$D/CAPTION_REPORT.json" "$D/CAPTION_LINKS.txt"
          git commit -m "chore(captions): publish caption+sticker montage [skip ci]" || echo "nothing to commit"
          git push origin HEAD:arena/ecff9abf-absorbs || true
