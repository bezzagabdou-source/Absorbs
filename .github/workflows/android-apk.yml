name: Android APK

on:
  push:
    branches: [arena/f205ded0-absorbs]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../DZ-Exchange.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DZ-Exchange-APK
          path: DZ-Exchange.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: DZ Exchange Android ${{ github.run_number }}
          body: |
            Installable Android APK for https://marketplace-fixed.vercel.app.
            Direct asset: DZ-Exchange.apk
          files: DZ-Exchange.apk
          fail_on_unmatched_files: true
