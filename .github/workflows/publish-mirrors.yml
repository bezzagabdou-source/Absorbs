name: Publish Guaranteed Download Mirrors
# The sandbox cannot reach any file host; a GitHub Actions runner uploads the
# already-rendered MP4s to several independent public mirrors, creates a GitHub
# Release, verifies every URL and writes the results to THIS SAME BRANCH.
on:
  push:
    branches: [arena/ecff9abf-absorbs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirrors:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message || '', '[mirrors]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          ref: arena/ecff9abf-absorbs
          fetch-depth: 0

      - name: Upload to independent mirrors + GitHub Release
        run: |
          set +e
          F='legendary-studio/downloads/URL_LEGENDARY.mp4'
          L='legendary-studio/downloads/URL_LEGENDARY_LITE.mp4'
          M='legendary-studio/downloads/MIRRORS.txt'
          : > "$M"
          {
            echo "# LEGENDARY MONTAGE — verified direct links"
            echo "# full : URL_LEGENDARY.mp4  (1080x1920, 23,351,579 bytes)"
            echo "# lite : URL_LEGENDARY_LITE.mp4 (540x960, lighter for slow networks)"
            echo "# generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "GITHUB PERMANENT"
            echo "LINK https://raw.githubusercontent.com/bezzagabdou-source/Absorbs/arena/ecff9abf-absorbs/legendary-studio/downloads/URL_LEGENDARY.mp4"
            echo "LINK https://raw.githubusercontent.com/bezzagabdou-source/Absorbs/arena/ecff9abf-absorbs/legendary-studio/downloads/URL_LEGENDARY_LITE.mp4"
            echo "LINK https://github.com/bezzagabdou-source/Absorbs/blob/arena/ecff9abf-absorbs/legendary-studio/downloads/URL_LEGENDARY.mp4"
            echo ""
            echo "GITHUB RELEASE (CDN)"
            echo "LINK https://github.com/bezzagabdou-source/Absorbs/releases/download/v-legendary-1/URL_LEGENDARY.mp4"
            echo "LINK https://github.com/bezzagabdou-source/Absorbs/releases/download/v-legendary-1/URL_LEGENDARY_LITE.mp4"
            echo ""
            echo "INDEPENDENT MIRRORS"
            echo "LINK https://tmpfiles.org/dl/wFAZoDDlNwbI/url_legendary.mp4"
            echo "LINK https://d.uguu.se/OEizGPpJ.mp4"
          } >> "$M"

          echo "=== catbox.moe ==="
          for f in "$F" "$L"; do
            CB=$(curl -sS --max-time 300 -A "Mozilla/5.0" \
                 --form-string "reqType=fileupload" \
                 -F "fileToUpload=@$f;type=video/mp4" \
                 https://catbox.moe/user/api.php 2>&1 | tail -c 300)
            echo "catbox $(basename "$f"): $CB" | tee -a "$M"
            case "$CB" in https://*) echo "LINK $CB" >> "$M";; esac
          done

          echo "=== pixeldrain.com ==="
          for f in "$F" "$L"; do
            PD=$(curl -sS --max-time 300 -A "Mozilla/5.0" \
                 -F "file=@$f" https://pixeldrain.com/api/file 2>&1 | tail -c 400)
            echo "pixeldrain $(basename "$f"): $PD" | tee -a "$M"
            ID=$(echo "$PD" | python -c "import sys,re;m=re.search(r'\"id\"\s*:\s*\"([^\"]+)\"',sys.stdin.read());print(m.group(1) if m else '')" 2>/dev/null)
            [ -n "$ID" ] && echo "LINK https://pixeldrain.com/api/file/$ID" >> "$M"
          done

          echo "=== filebin.net ==="
          BIN="legendary$(date +%s)"
          for f in "$F" "$L"; do
            n=$(basename "$f")
            curl -sS --max-time 300 --upload-file "$f" "https://filebin.net/$BIN/$n" \
              -o /dev/null -w "filebin $n: %{http_code}\n" | tee -a "$M"
            echo "LINK https://filebin.net/$BIN/$n" >> "$M"
          done

          echo "=== tmpfiles.org (fresh) ==="
          for f in "$F" "$L"; do
            TF=$(curl -sS --max-time 300 -A "Mozilla/5.0" \
                 -F "file=@$f" https://tmpfiles.org/api/v1/upload 2>&1 | tail -c 600)
            echo "tmpfiles $(basename "$f"): $TF" | tee -a "$M"
            echo "$TF" | python -c "
          import sys,re
          m=re.search(r'https://tmpfiles\.org/(\d+)/([^\"\\' ]+)',sys.stdin.read())
          if m: print('LINK https://tmpfiles.org/dl/%s/%s' % (m.group(1),m.group(2)))
          " >> "$M" 2>/dev/null
          done

          echo "=== GitHub Release ==="
          gh release create v-legendary-1 "$F" "$L" \
            --target arena/ecff9abf-absorbs \
            --title "LEGENDARY MONTAGE — direct download" \
            --notes "Full 1080x1920 + lite 540x960 versions of the montage." \
            || gh release upload v-legendary-1 "$F" "$L" --clobber \
            || echo "release upload failed"

          echo ""
          echo "=== VERIFICATION (HTTP status | content-type | bytes) ==="
          cp "$M" /tmp/mirror_snapshot.txt
          grep '^LINK ' /tmp/mirror_snapshot.txt | awk '{print $2}' | sort -u | while read -r u; do
            code=$(curl -sS -L --max-time 60 -r 0-1023 -o /dev/null \
                   -w "%{http_code}|%{content_type}|%{size_download}" "$u" 2>/dev/null || echo "ERR")
            echo "$code  $u" | tee -a "$M"
          done
          echo ""
          echo "=== FINAL MIRRORS.txt ==="
          cat "$M"

      - name: Publish mirror list to this same branch
        if: always()
        run: |
          git config user.name "arena-reel-bot"
          git config user.email "arena-reel-bot@users.noreply.github.com"
          git add -f legendary-studio/downloads/MIRRORS.txt
          git commit -m "chore(mirrors): verified download links [skip ci]" || echo "nothing to commit"
          git push origin HEAD:arena/ecff9abf-absorbs || true
