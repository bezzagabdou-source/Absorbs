name: QA — roam capture (fast loop)

# Diagnostic-only. One screen, one shot, committed straight back to the branch so
# a capture can be inspected without waiting for the full three-job pipeline.
on:
  push:
    paths:
      - "racing/**"
      - ".github/workflows/qa-roam.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4.1-stable"
  GODOT_DIR: /tmp/godot

jobs:
  roam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          mkdir -p "$GODOT_DIR"
          curl -fL --retry 3 -o "$GODOT_DIR/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q -o "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Import
        run: timeout 300 "$GODOT_DIR/godot" --headless --path racing --import || true

      - name: Capture roam
        run: |
          set -x
          mkdir -p racing/docs/screenshots
          # --qa-chase puts the camera in the real driving view and applies throttle,
          # which is the framing that matters: the intro orbits and then hands over.
          timeout -k 5 400 xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$GODOT_DIR/godot" --path racing --rendering-method gl_compatibility \
            --rendering-driver opengl3 --resolution 1920x1080 \
            --write-movie /tmp/roam.png --fixed-fps 30 --quit-after 110 \
            -- --screen=roam --qa-probe --qa-chase >/tmp/roam.log 2>&1 || true
          last=$(ls -t /tmp/roam*.png 2>/dev/null | head -1)
          echo "captured: $last"
          [ -n "$last" ] && cp "$last" racing/docs/screenshots/qa_roam_chase.png
          { echo "==== console ===="; echo "lines=$(wc -l < /tmp/roam.log)"; tail -80 /tmp/roam.log; } > racing/docs/qa_console.log || true
          find "$HOME/.local/share/godot/app_userdata" -name 'qa_probe.log' \
            -exec cp {} racing/docs/qa_probe_chase.log \; 2>/dev/null || true
          # an empty log means the run never started (timeout), not a compile error
          if [ "$(wc -l < /tmp/roam.log)" -lt 5 ]; then
            echo "::warning::the roam capture produced no output; see the step log"
          fi
          if grep -qiE 'SCRIPT ERROR|Parse Error|Compilation failed' racing/docs/qa_console.log; then
            echo "::error::the roam scene failed to compile; this capture is not valid"
            grep -iE 'SCRIPT ERROR|Parse Error' racing/docs/qa_console.log | head -6
            exit 1
          fi

      - name: Commit the capture
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add -f racing/docs/screenshots/qa_roam_chase.png racing/docs/qa_probe_chase.log racing/docs/qa_console.log 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore(qa): roam capture [skip ci]"
          git fetch origin arena/cf18c72b-absorbs
          git rebase origin/arena/cf18c72b-absorbs || git rebase --abort || true
          git push origin HEAD:arena/cf18c72b-absorbs || true
