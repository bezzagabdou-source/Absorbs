name: QA — roam capture (fast loop)

# Diagnostic-only workflow. One screen, one shot, committed straight back to the
# branch so the agent can look at it without waiting 13 minutes for the full
# three-job pipeline. Never publishes anything.
on:
  workflow_dispatch:
  # workflow_dispatch only works from the default branch, and this branch is not
  # it, so a push to the game tree also runs the fast capture.
  push:
    paths:
      - "racing/**"
      - ".github/workflows/qa-roam.yml"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4.1-stable"
  GODOT_DIR: /tmp/godot

jobs:
  roam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          python3 -m pip install --quiet --break-system-packages pillow numpy || true
          mkdir -p "$GODOT_DIR"
          curl -fL --retry 3 -o "$GODOT_DIR/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q -o "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Import
        run: |
          timeout 300 "$GODOT_DIR/godot" --headless --path racing --import || true

      - name: Capture roam
        run: |
          set -x
          mkdir -p racing/docs/screenshots
          for variant in plain lifted; do
            extra=""
            [ "$variant" = "debug" ] && extra="--debug-flat"
            [ "$variant" = "lifted" ] && extra="--qa-std-road --qa-lift"
            timeout -k 5 200 xvfb-run -a -s "-screen 0 1920x1080x24" \
              "$GODOT_DIR/godot" --path racing --rendering-method gl_compatibility \
              --rendering-driver opengl3 --resolution 1920x1080 \
              --write-movie /tmp/roam_${variant}.png --fixed-fps 30 --quit-after 110 \
              -- --screen=roam --qa-probe $extra >"/tmp/roam_${variant}.log" 2>&1 || true
            last=$(ls -t /tmp/roam_${variant}*.png 2>/dev/null | head -1)
            echo "== $variant -> $last"
            [ -n "$last" ] && cp "$last" "racing/docs/screenshots/qa_roam_${variant}.png"
            # user:// lives under different app ids between runs, so glob both
            find "$HOME/.local/share/godot/app_userdata" -name 'qa_probe.log' \
              -exec cp {} "racing/docs/qa_probe_${variant}.log" \; 2>/dev/null || true
            ls -la racing/docs/qa_probe_${variant}.log 2>/dev/null || echo "NO PROBE LOG for $variant"
            grep -iE 'SCRIPT ERROR|Parse Error' "/tmp/roam_${variant}.log" | head -5 || true
          done
          { echo "==== console ===="; tail -60 /tmp/roam_plain.log; } > racing/docs/qa_console.log || true
          # A parse error makes the scene come up empty, and an empty scene renders
          # as a perfectly black frame that looks exactly like a lighting bug. Fail
          # loudly instead of handing back a black screenshot.
          if grep -qiE 'SCRIPT ERROR|Parse Error|Compilation failed' racing/docs/qa_console.log; then
            echo "::error::the roam scene failed to compile; the capture is not valid"
            grep -iE 'SCRIPT ERROR|Parse Error' racing/docs/qa_console.log | head -6
            exit 1
          fi

      - name: Commit the captures
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add -f racing/docs/screenshots/qa_roam_*.png racing/docs/qa_probe*.log racing/docs/qa_console.log 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore(qa): roam capture [skip ci]"
          # the branch moves while this job runs (other commits land), so a plain
          # push is rejected; rebase onto whatever is there and retry
          git fetch origin arena/cf18c72b-absorbs
          git rebase origin/arena/cf18c72b-absorbs || git rebase --abort || true
          git push origin HEAD:arena/cf18c72b-absorbs || (sleep 5 && git push origin HEAD:arena/cf18c72b-absorbs) || true
