<!doctype html>
<html lang="ar" dir="rtl">
<head>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(1200px 700px at 50% -10%, #123d2b 0%, #0a1622 55%, #060b14 100%);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif; color: #eafff3; padding: 28px 16px; gap: 18px; text-align: center;
  }
  .brand { font-size: clamp(30px, 7vw, 44px); font-weight: 900; letter-spacing: .5px;
    background: linear-gradient(180deg,#ffffff,#9fffd0 45%,#16a34a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .badge { display: inline-block; margin-top: 6px; font-size: 15px; font-weight: 800; color: #052e16;
    background: linear-gradient(180deg,#86efac,#22c55e); border-radius: 999px; padding: 4px 18px; box-shadow: 0 0 24px rgba(34,197,94,.45); }
  .sub { color: #b7f4cf; font-size: 15px; max-width: 46ch; }
  .poster { width: min(78vw, 360px); aspect-ratio: 1/1; object-fit: cover; border-radius: 26px;
    border: 1px solid rgba(134,239,172,.35); box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 60px rgba(34,197,94,.25); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip { font-size: 12.5px; color: #c9ffe0; background: rgba(34,197,94,.12); border: 1px solid rgba(134,239,172,.35); border-radius: 999px; padding: 6px 14px; }
  .cta { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-size: 19px; font-weight: 800; color: #04240f;
    background: linear-gradient(180deg,#86efac,#22c55e); padding: 14px 30px; border-radius: 16px; box-shadow: 0 12px 34px rgba(34,197,94,.4); }
  .qr { display: flex; align-items: center; gap: 12px; color: #9fe8bd; font-size: 13px; }
  .qr img { border-radius: 12px; background: #fff; padding: 6px; }
  .handle { direction: ltr; color: #d5ffe7; font-weight: 700; }
  footer { color: #5f8b70; font-size: 12px; margin-top: 6px; }
  footer a { color: #86efac; text-decoration: none; }
</style>
</head>
<body>
  <div>
    <div class="brand">CHINWI</div>
    <span class="badge">بوت تواصل</span>
  </div>
  <p class="sub">تواصل معانا — تواصل مع المالك مباشرة من تيليجرام، وهو يرد عليك بنفسه.</p>
  <img class="poster" src="https://chinwi-store.vercel.app/catalog/chinwi-contact-poster.jpg?v=2" alt="CHINWI بوت تواصل — بوستر رسمي" />
  <div class="chips"><span class="chip">⚡ رد سريع</span><span class="chip">🔒 خصوصية تامة</span><span class="chip">🇩🇿 خدمة جزائرية 100%</span></div>
  <a class="cta" href="https://t.me/chinwicontactbot">💬 افتح بوت تواصل</a>
  <div class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://t.me/chinwicontactbot" alt="QR — بوت تواصل" width="92" height="92" /><span>امسح لتفتح<br/>بوت تواصل</span></div>
  <div class="handle">@chinwicontactbot</div>
  <footer>CHINWI STORE • تواصل معانا • <a href="https://chinwi-store.vercel.app">chinwi-store.vercel.app</a></footer>
